name: Java CI

on:
  pull_request:
    branches:
      - main
    paths:
      - '**.java'
      - 'scripts/audit-player-text.py'
      - 'scripts/java_text_calls.py'
      - 'scripts/tests/**'
      - 'src/main/resources/**'
      - 'src/generated/resources/**'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/gradle.yml'

  push:
    branches:
      - main
    # Release only when inputs to the mod artifact or its build change. In
    # particular, docs, AI instructions, release notes, update.json, and
    # workflow-only edits must not create a new release.
    paths:
      - 'src/main/**'
      - 'src/generated/resources/**'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'packsquash.toml'

permissions:
  pull-requests: read
  contents: write # for actions/checkout to fetch code and gradle to submit the dependency graph file
  security-events: write
  actions: read

jobs:
  gradle-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21 Temurin
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ./.gradle/loom-cache/remapped-mods
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle', '**/gradle-wrapper.properties') }}

      - name: Setup Gradle # Generates and submits the dependency graph
        uses: gradle/actions/setup-gradle@v6
        with:
          dependency-graph: generate-and-submit
          artifact-retention-days: 2

      - name: Audit player text and verify the auditor
        run: |
          python3 scripts/audit-player-text.py
          python3 -m unittest discover -s scripts/tests -v

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle # Runs the build (Fool-proof stuff)
        run: ./gradlew build

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(grep '^mod_version=' gradle.properties | cut -d= -f2-)"
          minecraft_version="$(grep '^minecraft_version=' gradle.properties | cut -d= -f2-)"
          lower_version="$(printf '%s' "$version" | tr '[:upper:]' '[:lower:]')"
          if [[ "$lower_version" == *alpha* || "$lower_version" == *beta* ]]; then
            echo "::notice::Skipping GitHub Release for non-stable version '$version'."
            exit 0
          fi

          artifact="build/libs/dragonminez-${minecraft_version}-${version}.jar"
          if [[ ! -f "$artifact" ]]; then
            echo "::error::Expected release artifact does not exist: $artifact"
            exit 1
          fi

          existing_for_commit="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate \
            --jq ".[] | select((.body // \"\") | contains(\"<!-- source-commit: ${GITHUB_SHA} -->\")) | .tag_name")"
          if [[ -n "$existing_for_commit" ]]; then
            echo "::notice::Commit ${GITHUB_SHA} already has release '$existing_for_commit'; skipping duplicate run."
            exit 0
          fi

          base_tag="v${version}"
          if gh release view "$base_tag" >/dev/null 2>&1; then
            hotfix_number=0
            release_tags="$(gh release list --limit 1000 --json tagName --jq '.[].tagName')"
            while IFS= read -r existing_tag; do
              if [[ "$existing_tag" == "${base_tag}-hotfix" ]]; then
                (( hotfix_number < 1 )) && hotfix_number=1
              elif [[ "$existing_tag" == "${base_tag}-hotfix-"* ]]; then
                candidate="${existing_tag#"${base_tag}-hotfix-"}"
                if [[ "$candidate" =~ ^[0-9]+$ ]]; then
                  candidate_number=$((10#$candidate))
                  (( candidate_number > hotfix_number )) && hotfix_number="$candidate_number"
                fi
              fi
            done <<< "$release_tags"

            hotfix_number=$((hotfix_number + 1))
            tag="${base_tag}-hotfix-${hotfix_number}"
            title="DragonMineZ ${version} - Hotfix ${hotfix_number} (Minecraft ${minecraft_version})"
            if [[ -f "release-notes/${version}-hotfix-${hotfix_number}.md" ]]; then
              notes_file="release-notes/${version}-hotfix-${hotfix_number}.md"
            elif [[ -f "release-notes/${version}-hotfix.md" ]]; then
              notes_file="release-notes/${version}-hotfix.md"
            elif [[ -f "release-notes/${version}.md" ]]; then
              notes_file="release-notes/${version}.md"
            else
              notes_file="CHANGELOG.md"
            fi
          else
            tag="$base_tag"
            title="DragonMineZ ${version} (Minecraft ${minecraft_version})"
            if [[ -f "release-notes/${version}.md" ]]; then
              notes_file="release-notes/${version}.md"
            else
              notes_file="CHANGELOG.md"
            fi
          fi

          release_notes="$RUNNER_TEMP/release-notes.md"
          cp "$notes_file" "$release_notes"
          printf '\n\n<!-- source-commit: %s -->\n' "$GITHUB_SHA" >> "$release_notes"

          gh release create "$tag" "$artifact" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes-file "$release_notes"
