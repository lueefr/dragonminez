name: Java CI

on:
  pull_request:
    branches:
      - main
    paths:
      - '**.java'
      - 'src/main/resources/**'
      - 'src/generated/resources/**'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/gradle.yml'

  push:
    branches:
      - main
    paths:
      - '**.java'
      - 'src/main/resources/**'
      - 'src/generated/resources/**'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/gradle.yml'

permissions:
  pull-requests: read
  contents: write # for actions/checkout to fetch code and gradle to submit the dependency graph file
  security-events: write
  actions: read

jobs:
  gradle-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21 Temurin
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ./.gradle/loom-cache/remapped-mods
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle', '**/gradle-wrapper.properties') }}

      - name: Setup Gradle # Generates and submits the dependency graph
        uses: gradle/actions/setup-gradle@v6
        with:
          dependency-graph: generate-and-submit
          artifact-retention-days: 2

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle # Runs the build (Fool-proof stuff)
        run: ./gradlew build

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(grep '^mod_version=' gradle.properties | cut -d= -f2-)"
          minecraft_version="$(grep '^minecraft_version=' gradle.properties | cut -d= -f2-)"
          lower_version="$(printf '%s' "$version" | tr '[:upper:]' '[:lower:]')"
          if [[ "$lower_version" == *alpha* || "$lower_version" == *beta* ]]; then
            echo "::notice::Skipping GitHub Release for non-stable version '$version'."
            exit 0
          fi

          tag="v${version}"
          artifact="build/libs/dragonminez-${minecraft_version}-${version}.jar"
          if [[ ! -f "$artifact" ]]; then
            echo "::error::Expected release artifact does not exist: $artifact"
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::GitHub Release '$tag' already exists; skipping duplicate release."
            exit 0
          fi

          if [[ -f "release-notes/${version}.md" ]]; then
            notes_file="release-notes/${version}.md"
          else
            notes_file="CHANGELOG.md"
          fi

          gh release create "$tag" "$artifact" \
            --title "DragonMineZ ${version} (Minecraft ${minecraft_version})" \
            --notes-file "$notes_file"
