name: Java CI

on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
    paths:
      - '**.java'
      - 'scripts/audit-player-text.py'
      - 'scripts/java_text_calls.py'
      - 'scripts/tests/**'
      - 'src/main/resources/**'
      - 'src/generated/resources/**'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'scripts/release/**'
      - '.github/workflows/gradle.yml'

  push:
    branches:
      - main
    # Release only when inputs to the mod artifact or its build change. In
    # particular, docs, AI instructions, release notes, update.json, and
    # workflow-only edits must not create a new release.
    paths:
      - 'src/main/**'
      - 'src/generated/resources/**'
      - 'build.gradle.kts'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'packsquash.toml'
      - 'scripts/release/**'
      - '.github/workflows/gradle.yml'

concurrency:
  group: java-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  pull-requests: read
  contents: write # for actions/checkout to fetch code and gradle to submit the dependency graph file
  actions: read

jobs:
  gradle-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21 Temurin
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle # Generates and submits the dependency graph
        uses: gradle/actions/setup-gradle@v6
        with:
          dependency-graph: generate-and-submit
          artifact-retention-days: 2

      - name: Audit player text and verify the auditor
        run: |
          python3 scripts/audit-player-text.py
          python3 -m unittest discover -s scripts/tests -v
          python3 -m unittest discover -s scripts/release -p "*_test.py" -v

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle # Runs the build (Fool-proof stuff)
        run: |
          ./gradlew build
          python3 scripts/check-packaged-resources.py build/libs/*.jar

      - name: Publish exact source release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main --tags
          python3 -m scripts.release.github_release publish --repository "$GITHUB_REPOSITORY" --source "$GITHUB_SHA"
