name: Fabric 26.1.2 port checks

on:
  push:
    branches: [port/2.2-fabric-26.1.2]

permissions:
  contents: read

concurrency:
  group: fabric-26.1.2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/wrapper-validation@v6
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify extension API core
        run: ./gradlew verifyExtensionApiCore
      - name: Build complete Fabric mod
        run: ./gradlew build
